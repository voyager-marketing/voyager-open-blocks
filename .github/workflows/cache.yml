name: Cache

# npm run cache-check: does a Site Data change reach a page that a cache has
# already stored? Each row of the matrix is one cache and one mode, and runs
# as its own check. docs/development.md ("Cache check") explains the modes.
#
# `expect` is the outcome a row asserts, read from the harness's result file:
#   fresh  the change reached the page   (the harness exits 0)
#   stale  the cache kept the old number (the harness exits 1)
# scripts/cache-check-row.mjs passes a row only when the result file names
# that outcome and the exit code agrees. The exit code alone is not enough:
# Node exits 1 on an uncaught exception and npm exits 1 on a missing script,
# and 1 is the code for stale. A crash writes no result file, or one that
# says unmeasured, and fails every row.
#
# The pack purges when Site Data changes (contract 2 in
# docs/v2-contracts.md, inc/freshness/purge.php), so the rows that use it
# expect fresh:
# - `dummy --spy`: the dummy cache offers the pack an adapter, and the
#   adapter is told to purge the page.
# - `wp-super-cache --real`: the pack's purge calls clean_post_cache() for
#   each page that shows the field, up to 50, and WP Super Cache 3.1.5
#   purges that page on clean_post_cache (wpsc_register_post_hooks() in
#   wp-cache-phase2.php). The pack's WP Super Cache adapter
#   (inc/cache/wp-super-cache.php) deletes the page's URL too.
# - `wp-super-cache --real --pages 51`: 51 pages show the phone, and the
#   one measured has the highest ID, so it is past the 50 the purge cleans
#   one by one. The purge sets purge_all for it, and the WP Super Cache
#   adapter turns purge_all into a clear of WP Super Cache's cache.
# The three --no-purge rows are controls and stay stale for good. They show
# the check can fail. On a one-page row the empty URL list switches the
# whole purge off, clean_post_cache() included. On the 51-page row the
# purge still cleans the first 50 pages and sets purge_all, and with no
# adapter left nothing reaches the 51st.
# `wp-super-cache --real --lockdown` expects stale for good too. In Lock
# Down WP Super Cache hooks none of its own purges, and the adapter is
# inactive, so a change refreshes no page; fresh means the pack purged
# through Lock Down.
#
# A new cache is a row in PLUGINS (scripts/lib/cache-check.mjs) and rows
# here: --real if it serves pages from PHP inside Playground, else --spy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-check:
    name: cache-check ${{ matrix.plugin }} --${{ matrix.mode }}${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # WP Super Cache serving the page from PHP. Fresh: it purges the
          # page on the pack's clean_post_cache() call, and the pack's
          # adapter deletes the page's URL.
          - plugin: wp-super-cache
            mode: real
            flags: ''
            expect: fresh
          # Control. With the pack's purge emptied the page must go stale.
          # This is the issue's fitness command.
          - plugin: wp-super-cache
            mode: real
            flags: ' --no-purge'
            expect: stale
          # A page past the first 50 that show the field. Fresh only through
          # the pack's WP Super Cache adapter, which hears purge_all.
          - plugin: wp-super-cache
            mode: real
            flags: ' --pages 51'
            expect: fresh
          # Control for the row above: with the purge emptied, stale.
          - plugin: wp-super-cache
            mode: real
            flags: ' --pages 51 --no-purge'
            expect: stale
          # Lock Down keeps WP Super Cache's pages through a traffic spike,
          # and the pack must leave them alone, as WP Super Cache does with
          # its own post hooks: stale, and fresh means the adapter purged.
          - plugin: wp-super-cache
            mode: real
            flags: ' --lockdown'
            expect: stale
          # The pack's own purge, through the dummy cache's adapter.
          - plugin: dummy
            mode: spy
            flags: ''
            expect: fresh
          # Positive control for --spy: the harness's stand-in purge runs
          # contract 2 by hand, and the dummy cache must hear the page's URL.
          - plugin: dummy
            mode: spy
            flags: ' --stand-in'
            expect: fresh
          # Control. --no-purge empties the stand-in's purge too.
          - plugin: dummy
            mode: spy
            flags: ' --stand-in --no-purge'
            expect: stale
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: npm run cache-check (expect ${{ matrix.expect }})
        env:
          PLUGIN: ${{ matrix.plugin }}
          MODE: ${{ matrix.mode }}
          FLAGS: ${{ matrix.flags }}
          EXPECT: ${{ matrix.expect }}
        run: |
          result="$RUNNER_TEMP/cache-check.json"
          rm -f "$result"
          set +e
          # FLAGS is unquoted on purpose: it holds zero or more options.
          # shellcheck disable=SC2086
          npm run cache-check -- --plugin "$PLUGIN" "--$MODE" $FLAGS --result-file "$result"
          code=$?
          set -e
          node scripts/cache-check-row.mjs --expect "$EXPECT" --exit "$code" --result-file "$result"

      - name: Result
        if: always()
        run: cat "$RUNNER_TEMP/cache-check.json" 2>/dev/null || echo 'No result file was written.'
