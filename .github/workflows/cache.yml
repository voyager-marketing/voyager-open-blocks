name: Cache

# npm run cache-check: does a Site Data change reach a page that a cache has
# already stored? Each row of the matrix is one cache and one mode, and runs
# as its own check. docs/development.md ("Cache check") explains the modes.
#
# `expect` is the outcome a row asserts, read from the harness's result file:
#   fresh  the change reached the page   (the harness exits 0)
#   stale  the cache kept the old number (the harness exits 1)
# scripts/cache-check-row.mjs passes a row only when the result file names
# that outcome and the exit code agrees. The exit code alone is not enough:
# Node exits 1 on an uncaught exception and npm exits 1 on a missing script,
# and 1 is the code for stale. A crash writes no result file, or one that
# says unmeasured, and fails every row.
#
# Four rows expect stale today, on purpose:
# - The two --no-purge rows are controls and stay stale for good. They show
#   the check can fail.
# - `dummy --spy` and `wp-super-cache --real` record today's bug: the pack
#   does not purge anything when Site Data changes (contract 2 in
#   docs/v2-contracts.md). The change that adds the pack's purge flips
#   `dummy --spy` to fresh, since the dummy cache offers the pack an
#   adapter. `wp-super-cache --real` flips once a WP Super Cache adapter
#   exists. Each goes red when its purge starts working, until its expect
#   is flipped.
#
# A new cache is a row in PLUGINS (scripts/lib/cache-check.mjs) and rows
# here: --real if it serves pages from PHP inside Playground, else --spy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-check:
    name: cache-check ${{ matrix.plugin }} --${{ matrix.mode }}${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # WP Super Cache serving the page from PHP. Stale until a WP Super
          # Cache adapter exists, then fresh.
          - plugin: wp-super-cache
            mode: real
            flags: ''
            expect: stale
          # Control. With the pack's purge emptied the page must go stale.
          # This is the issue's fitness command.
          - plugin: wp-super-cache
            mode: real
            flags: ' --no-purge'
            expect: stale
          # The pack's own purge, through the dummy cache's adapter. Stale
          # until the pack purges, then fresh.
          - plugin: dummy
            mode: spy
            flags: ''
            expect: stale
          # Positive control for --spy: the harness's stand-in purge runs
          # contract 2 by hand, and the dummy cache must hear the page's URL.
          - plugin: dummy
            mode: spy
            flags: ' --stand-in'
            expect: fresh
          # Control. --no-purge empties the stand-in's purge too.
          - plugin: dummy
            mode: spy
            flags: ' --stand-in --no-purge'
            expect: stale
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: npm run cache-check (expect ${{ matrix.expect }})
        env:
          PLUGIN: ${{ matrix.plugin }}
          MODE: ${{ matrix.mode }}
          FLAGS: ${{ matrix.flags }}
          EXPECT: ${{ matrix.expect }}
        run: |
          result="$RUNNER_TEMP/cache-check.json"
          rm -f "$result"
          set +e
          # FLAGS is unquoted on purpose: it holds zero or more options.
          # shellcheck disable=SC2086
          npm run cache-check -- --plugin "$PLUGIN" "--$MODE" $FLAGS --result-file "$result"
          code=$?
          set -e
          node scripts/cache-check-row.mjs --expect "$EXPECT" --exit "$code" --result-file "$result"

      - name: Result
        if: always()
        run: cat "$RUNNER_TEMP/cache-check.json" 2>/dev/null || echo 'No result file was written.'
