name: Block Check

on:
  pull_request:
  push:
    branches: [main]
  # VOY-1855. Dispatched by release-please.yml on its release branch. The
  # action's PR comment step only runs on pull_request, so a dispatch skips it.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  blocks:
    name: Validate pattern markup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voyager-marketing/voyager-block-check@v1
        with:
          paths: patterns/*.html patterns/**/*.html
