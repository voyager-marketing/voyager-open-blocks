name: Release Please

# VOY-1829. release-please opens the release PR (version bump in
# voyager-open-blocks.php, readme.txt, package.json and CHANGELOG.md). Merging
# that PR creates the tag and the GitHub Release. A release created with
# GITHUB_TOKEN fires no downstream workflow, so the plugin zip is built and
# attached in this same run. No PAT.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # VOY-1855. To approve the release PR's held pull_request runs.
  actions: write

jobs:
  release-please:
    name: Release PR and plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the zip
        if: steps.release.outputs.release_created == 'true'
        run: |
          npm ci
          npm run build
          npm run zip

      # Same list as release.yml, the manual re-attach path.
      - name: Check the zip
        if: steps.release.outputs.release_created == 'true'
        run: |
          list="$RUNNER_TEMP/zip.txt"
          unzip -Z1 voyager-open-blocks.zip > "$list"
          test "$(cut -d/ -f1 "$list" | sort -u)" = voyager-open-blocks
          for path in build/blocks-manifest.php inc/ assets/ patterns/ skills/ blueprints/ LICENSE README.md readme.txt voyager-open-blocks.php; do
            grep -q "^voyager-open-blocks/$path" "$list" || { echo "::error::zip is missing $path"; exit 1; }
          done
          # playground/ is demo seeding for blueprints, which install from Git.
          test "$(grep -c -E '/node_modules/|/scripts/|/tests/|/src/|/playground/' "$list")" -eq 0

      - name: Attach the zip to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" voyager-open-blocks.zip --clobber

      # VOY-1855. GitHub creates the pull_request runs for a PR this token
      # opens or pushes to, but holds them as action_required until someone
      # approves them, and the PR's check rollup only counts those runs. So
      # approve them here. They appear a few seconds after the PR event, and
      # two workflows run on pull_request (CI and Block Check), so wait up to
      # three minutes for both. prs is empty when the PR was left unchanged.
      # Last in the job, so a failed approval cannot cost a release its zip.
      - name: Approve the release PR's held checks
        if: ${{ !cancelled() && steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          for pr in $(jq -r '.[].number' <<< "$PRS"); do
            sha=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)
            approved=0
            for try in $(seq 1 18); do
              held=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
              for id in $held; do
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" --silent
                echo "Approved run $id on #$pr ($sha)"
                approved=$((approved + 1))
              done
              [ "$approved" -ge 2 ] && break
              sleep 10
            done
            [ "$approved" -ge 2 ] || echo "::warning::#$pr: approved $approved of 2 held runs on $sha"
          done
